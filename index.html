<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الاشتراكات الرقمية</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 500px; background: white; margin: 20px auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        .product-card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 15px; margin: 15px 0; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .product-card img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        .product-title { font-size: 18px; font-weight: bold; color: #2c3e50; }
        .product-price { color: #27ae60; font-weight: bold; margin: 5px 0 10px 0; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #25D366; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; font-size: 15px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #1ebe5d; }
        .admin-section { background: #f1f2f6; padding: 15px; border-radius: 10px; margin-top: 30px; border: 2px dashed #ced6e0; text-align: right; }
        .admin-toggle { background: #718093; margin-bottom: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🛍️ متجر الاشتراكات الرقمية</h2>
        <p>اختر الاشتراك المناسب واضغط على إتمام الطلب</p>

        <!-- قائمة المنتجات التي تظهر للزوار -->
        <div id="products-list">
            <!-- المنتجات تضاف هنا تلقائياً -->
        </div>

        <!-- نموذج إتمام الطلب -->
        <div id="order-form-container" class="hidden product-card" style="background: #e3fafc; border-color: #79c0ff;">
            <h3 id="selected-product-name">إتمام الطلب</h3>
            <input type="text" id="cust-name" placeholder="اسمك الكامل" required>
            <input type="tel" id="cust-phone" placeholder="رقم هاتفك" required>
            <button onclick="submitOrder()">إتمام الطلب</button>
            <button onclick="cancelOrder()" style="background-color: #e74c3c; margin-top: 5px;">إلغاء</button>
        </div>

        <!-- لوحة تحكم المسؤولين (إضافة منتج) -->
        <div class="admin-section">
            <button class="admin-toggle" onclick="toggleAdmin()">⚙️ لوحة تحكم المسؤولين (إضافة اشتراك)</button>
            <div id="admin-panel" class="hidden">
                <h4>إضافة اشتراك جديد للمتجر</h4>
                <input type="text" id="new-name" placeholder="اسم الاشتراك (مثلاً: Gemini Pro)">
                <input type="text" id="new-price" placeholder="السعر (مثلاً: 10,000 دينار)">
                <input type="text" id="new-img" placeholder="رابط صورة الاشتراك (ضع رابط صورة مباشر)">
                <button onclick="addProduct()" style="background-color: #2980b9;">حفظ ونشر الاشتراك</button>
            </div>
        </div>
    </div>

    <script>
        // رقم الواتساب الذي ستستقبل الطلبات عليه (استبدليه برقم الشخص الثاني)
        let targetPhone = "9647724186755"; 

        // المنتجات الافتراضية إذا كانت القائمة فارغة
        let defaultProducts = [
            { name: "اشتراك Gemini Advanced", price: "15,000 د.ع", img: "https://i.imgur.com/7kf5U8N.png" },
            { name: "اشتراك ChatGPT Plus", price: "20,000 د.ع", img: "https://i.imgur.com/83Z93Xn.png" }
        ];

        let products = JSON.parse(localStorage.getItem('store_products')) || defaultProducts;
        let selectedProduct = "";

        function renderProducts() {
            let list = document.getElementById('products-list');
            list.innerHTML = "";
            products.forEach((p, index) => {
                list.innerHTML += `
                    <div class="product-card">
                        <img src="${p.img}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/100'">
                        <div class="product-title">${p.name}</div>
                        <div class="product-price">${p.price}</div>
                        <button onclick="openOrderForm('${p.name}')">اختيار وطلب الاشتراك</button>
                    </div>
                `;
            });
        }

        function toggleAdmin() {
            let panel = document.getElementById('admin-panel');
            panel.classList.toggle('hidden');
        }

        function addProduct() {
            let name = document.getElementById('new-name').value;
            let price = document.getElementById('new-price').value;
            let img = document.getElementById('new-img').value;

            if(!name || !price) {
                alert("يرجى ملء اسم الاشتراك والسعر على الأقل!");
                return;
            }

            products.push({ name, price, img: img || 'https://via.placeholder.com/100' });
            localStorage.setItem('store_products', JSON.stringify(products));
            
            document.getElementById('new-name').value = "";
            document.getElementById('new-price').value = "";
            document.getElementById('new-img').value = "";
            
            renderProducts();
            toggleAdmin();
            alert("تم إضافة الاشتراك بنجاح وأصبح ظاهراً في المتجر!");
        }

        function openOrderForm(productName) {
            selectedProduct = productName;
            document.getElementById('selected-product-name').innerText = "طلب: " + productName;
            document.getElementById('order-form-container').classList.remove('hidden');
            window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
        }

        function cancelOrder() {
            document.getElementById('order-form-container').classList.add('hidden');
        }

        function submitOrder() {
            let name = document.getElementById('cust-name').value;
            let phone = document.getElementById('cust-phone').value;

            if(!name || !phone) {
                alert("يرجى إدخال الاسم ورقم الهاتف!");
                return;
            }

            let message = `مرحباً، أريد طلب اشتراك:%0A- المنتج: ${selectedProduct}%0A- اسم الزبون: ${name}%0A- رقم الهاتف: ${phone}`;
            let whatsappURL = `https://wa.me/${targetPhone}?text=${message}`;
            window.open(whatsappURL, '_blank');
        }

        renderProducts();
    </script>

</body>
</html>
