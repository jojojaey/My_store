<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موني مود | ستور - Money Mod</title>
    <link rel="icon" id="site-favicon" href="https://i.imgur.com/7kf5U8N.png">
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f0f4f8; margin: 0; padding: 10px; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; padding: 10px; position: relative; }
        
        #become-admin-link {
            position: absolute;
            top: 5px;
            left: 10px;
            font-size: 11px;
            color: #7f8c8d;
            cursor: pointer;
            background: #e2e8f0;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
        }
        #become-admin-link:hover { background: #cbd5e1; color: #2c3e50; }

        .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; margin-bottom: 20px; }
        
        .product-card { background: #fff; border-radius: 16px; padding: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #eaeaea; }
        .product-card img { width: 100px; height: 100px; object-fit: cover; border-radius: 14px; margin: 0 auto 10px auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .product-title { font-size: 15px; font-weight: bold; color: #2c3e50; margin-bottom: 8px; min-height: 35px; display: flex; align-items: center; justify-content: center; }
        
        .product-info-box { display: flex; border-top: 1px solid #eee; padding-top: 8px; margin-bottom: 10px; }
        .info-col { flex: 1; text-align: center; }
        .info-col:first-child { border-left: 1px solid #eee; }
        .info-label { font-size: 11px; color: #888; display: block; margin-bottom: 2px; }
        .info-val { font-size: 13px; font-weight: bold; color: #27ae60; }
        .info-val.duration { color: #2980b9; }

        .buy-btn { background-color: #25D366; color: white; border: none; padding: 8px; width: 100%; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: bold; }
        .buy-btn:hover { background-color: #1ebe5d; }
        
        .delete-btn { background-color: #e74c3c; color: white; border: none; padding: 5px; width: 100%; border-radius: 6px; font-size: 11px; cursor: pointer; margin-top: 5px; display: none; }

        .order-box { background: #fff; border-radius: 16px; padding: 15px; margin-top: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 2px solid #3498db; text-align: right; }
        input { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        
        .admin-section { display: none; background: #fff; padding: 15px; border-radius: 16px; margin-top: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 2px dashed #3498db; text-align: right; }
        
        #floating-admin-btn {
            display: none;
            position: fixed;
            bottom: 25px;
            left: 25px;
            width: 60px;
            height: 60px;
            background-color: #2980b9;
            color: white;
            border-radius: 50%;
            text-align: center;
            font-size: 30px;
            line-height: 58px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 1000;
            font-weight: bold;
        }
        #floating-admin-btn:hover { background-color: #1f618d; }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <span id="become-admin-link" onclick="registerAdminFlow()">أريد أصير مدير</span>

        <div style="margin-top: 15px; margin-bottom: 15px;">
            <h2 style="color: #2c3e50; margin: 0; font-size: 24px;">🛍️ موني مود</h2>
            <span style="color: #e67e22; font-size: 13px; font-weight: bold; letter-spacing: 2px;">ســتــور (STORE)</span>
        </div>
        <p style="color: #7f8c8d; font-size: 13px; margin-bottom: 20px;">اختر الاشتراك المناسب واطلب مباشرة</p>

        <div id="products-list" class="products-grid"></div>

        <div id="order-form-container" class="order-box hidden">
            <h3 id="selected-product-name" style="color: #2980b9; text-align: center; margin-top: 0;">إتمام الطلب</h3>
            <label style="font-size: 13px; font-weight: bold;">اسمك الكامل:</label>
            <input type="text" id="cust-name" placeholder="أدخل اسمك هنا">
            <label style="font-size: 13px; font-weight: bold;">رقم هاتفـك:</label>
            <input type="tel" id="cust-phone" placeholder="أدخل رقمك هنا">
            <button class="buy-btn" onclick="submitOrder()" style="margin-top: 10px; font-size: 14px;">إرسال الطلب الآن</button>
            <button onclick="cancelOrder()" style="background-color: #95a5a6; color: white; border: none; padding: 8px; width: 100%; border-radius: 8px; margin-top: 5px; cursor: pointer;">إلغاء</button>
        </div>

        <div id="admin-panel" class="admin-section">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h4 style="color: #2980b9; margin: 0;">⚙️ لوحة إدارة المتجر</h4>
                <button onclick="closeAdminPanel()" style="background: #e74c3c; width: auto; padding: 5px 10px; font-size: 12px; border:none; color:white; border-radius:5px; cursor:pointer;">إغلاق</button>
            </div>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">
            
            <label style="font-size: 12px; font-weight: bold; color: #555;">رقم واتساب استلام الطلبات:</label>
            <input type="text" id="admin-phone" placeholder="مثلاً: 9647800000000" oninput="savePhone()" style="background: #f9f9f9;">
            <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">

            <input type="text" id="new-name" placeholder="اسم المنتج (مثلاً: اشتراك جمبر)">
            <input type="text" id="new-price" placeholder="سعر المنتج (مثلاً: 15 ألف)">
            <input type="text" id="new-duration" placeholder="مدة المنتج (اختياري - مثلاً: 18 شهر)">
            <input type="text" id="new-img-url" placeholder="رابط صورة المنتج (رابط مباشر للصورة)">

            <button class="buy-btn" onclick="addProduct()" style="background-color: #2980b9; margin-top: 10px;">➕ إضافة ونشر المنتج</button>
        </div>
    </div>

    <div id="floating-admin-btn" onclick="toggleAdminPanel()">+</div>

    <script>
        const ADMIN_SECRET_CODE = "2026"; 

        const defaultProducts = [
            {
                name: "جيماني برو",
                price: "15 ألف",
                duration: "18 شهر",
                img: "https://i.imgur.com/7kf5U8N.png"
            },
            {
                name: "موني مود ستور",
                price: "1",
                duration: "",
                img: "https://i.imgur.com/7kf5U8N.png"
            }
        ];

        let products = JSON.parse(localStorage.getItem('store_products')) || defaultProducts;
        let savedPhone = localStorage.getItem('store_target_phone') || "9647800680046";
        document.getElementById('admin-phone').value = savedPhone;

        let selectedProduct = "";
        let isRegisteredAdmin = localStorage.getItem('store_is_admin') === 'true';

        if (isRegisteredAdmin) {
            activateAdminMode();
        }

        function registerAdminFlow() {
            if (isRegisteredAdmin) {
                toggleAdminPanel();
                return;
            }

            let phone = prompt("يرجى إدخال رقم هاتفكِ:");
            if (!phone) return;
            let country = prompt("من أي بلد أنتِ؟");
            if (!country) return;
            let city = prompt("ما هي محافظتكِ؟");
            if (!city) return;
            
            let secret = prompt("أدخل كلمة السر الخاصة بصلاحيات الإدارة:");
            if (secret !== ADMIN_SECRET_CODE) {
                alert("كلمة السر غير صحيحة!");
                return;
            }

            let confirmWord = prompt("اكتبي كلمة ( تم ) لتأكيد التسجيل النهائي للأبد:");
            if (confirmWord && confirmWord.trim() === "تم") {
                localStorage.setItem('store_is_admin', 'true');
                isRegisteredAdmin = true;
                activateAdminMode();
                alert("تم تسجيلكِ كمديرة بنجاح تام!");
            }
        }

        function activateAdminMode() {
            document.getElementById('floating-admin-btn').style.display = 'block';
            document.getElementById('become-admin-link').innerText = "⚙️ الإدارة مفعلة";
            renderProducts();
        }

        function toggleAdminPanel() {
            let panel = document.getElementById('admin-panel');
            panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
        }

        function closeAdminPanel() {
            document.getElementById('admin-panel').style.display = 'none';
        }

        function savePhone() {
            let phoneVal = document.getElementById('admin-phone').value;
            localStorage.setItem('store_target_phone', phoneVal);
        }

        function renderProducts() {
            let list = document.getElementById('products-list');
            if (products.length === 0) {
                list.innerHTML = `<p style="grid-column: span 2; color: #888; font-size: 13px; text-align: center;">لا توجد منتجات مضافة حالياً.</p>`;
                return;
            }
            list.innerHTML = "";
            products.forEach((p, index) => {
                let deleteBtnHtml = isRegisteredAdmin ? `<button class="delete-btn" style="display:block;" onclick="deleteProduct(${index})">حذف المنتج</button>` : '';
                
                let durationHtml = p.duration ? `
                    <div class="product-info-box">
                        <div class="info-col">
                            <span class="info-label">مدة المنتج:</span>
                            <span class="info-val duration">${p.duration}</span>
                        </div>
                        <div class="info-col">
                            <span class="info-label">سعر المنتج:</span>
                            <span class="info-val">${p.price}</span>
                        </div>
                    </div>
                ` : `
                    <div class="product-info-box" style="justify-content: center;">
                        <div class="info-col" style="border:none;">
                            <span class="info-label">سعر المنتج:</span>
                            <span class="info-val" style="font-size: 15px;">${p.price}</span>
                        </div>
                    </div>
                `;

                list.innerHTML += `
                    <div class="product-card">
                        <div>
                            <img src="${p.img}" alt="${p.name}">
                            <div class="product-title">[ ${p.name} ]</div>
                            ${durationHtml}
                        </div>
                        <div>
                            <button class="buy-btn" onclick="openOrderForm('${p.name}')">طلب المنتج</button>
                            ${deleteBtnHtml}
                        </div>
                    </div>
                `;
            });
        }

        function addProduct() {
            let name = document.getElementById('new-name').value;
            let price = document.getElementById('new-price').value;
            let duration = document.getElementById('new-duration').value;
            let imgUrl = document.getElementById('new-img-url').value;

            if(!name || !price) {
                alert("يرجى ملء اسم المنتج والسعر على الأقل!");
                return;
            }

            let finalImg = imgUrl.trim() !== "" ? imgUrl : 'https://i.imgur.com/7kf5U8N.png';

            products.push({ name, price, duration, img: finalImg });
            localStorage.setItem('store_products', JSON.stringify(products));
            
            document.getElementById('new-name').value = "";
            document.getElementById('new-price').value = "";
            document.getElementById('new-duration').value = "";
            document.getElementById('new-img-url').value = "";
            
            renderProducts();
            document.getElementById('admin-panel').style.display = 'none';
            alert("تم إضافة المنتج بنجاح!");
        }

        function deleteProduct(index) {
            if(confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
                products.splice(index, 1);
                localStorage.setItem('store_products', JSON.stringify(products));
                renderProducts();
            }
        }

        function openOrderForm(productName) {
            selectedProduct = productName;
            document.getElementById('selected-product-name').innerText = "طلب: " + productName;
            document.getElementById('order-form-container').classList.remove('hidden');
            window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
        }

        function cancelOrder() {
            document.getElementById('order-form-container').classList.add('hidden');
        }

        function submitOrder() {
            let name = document.getElementById('cust-name5').value || document.getElementById('cust-name').value;
            let phone = document.getElementById('cust-phone').value;
            let currentPhone = document.getElementById('admin-phone').value || "9647800680046";

            if(!name || !phone) {
                alert("يرجى إدخال الاسم ورقم الهاتف!");
                return;
            }

            let message = `مرحباً، أريد طلب هذا المنتج من متجر موني مود:%0A- المنتج: ${selectedProduct}%0A- اسم الزبون: ${name}%0A- رقم الهاتف: ${phone}`;
            let whatsappURL = `https://wa.me/${currentPhone}?text=${message}`;
            window.open(whatsappURL, '_blank');
        }

        renderProducts();
    </script>

</body>
</html>
