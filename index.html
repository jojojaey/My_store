<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">موني مود ستور</title>
    <link rel="icon" id="site-favicon" href="https://i.imgur.com/kHI9Abj.png">
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f0f4f8; margin: 0; padding: 10px; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; padding: 10px; position: relative; }
        .top-nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .top-btn { font-size: 20px; color: #2c3e50; cursor: pointer; background: #fff; padding: 6px 14px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); font-weight: bold; border: none; }
        #sidebar { height: 100%; width: 0; position: fixed; z-index: 3000; top: 0; right: 0; background-color: #fff; overflow-x: hidden; transition: 0.3s; padding-top: 60px; box-shadow: -5px 0 15px rgba(0,0,0,0.1); text-align: right; }
        #sidebar a { padding: 14px 20px; text-decoration: none; font-size: 15px; color: #2c3e50; display: block; transition: 0.3s; border-bottom: 1px solid #f1f1f1; cursor: pointer; font-weight: bold; }
        #sidebar .close-btn { position: absolute; top: 10px; left: 15px; font-size: 22px; border: none; background: none; cursor: pointer; }
        .search-box { margin: 15px 0; }
        .search-box input { width: 100%; padding: 10px 15px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 14px; outline: none; background: #fff; box-sizing: border-box; }
        .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; margin-bottom: 20px; }
        .product-card { background: #fff; border-radius: 16px; padding: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #eaeaea; }
        .product-card img { width: 100px; height: 100px; object-fit: cover; border-radius: 14px; margin: 0 auto 10px auto; }
        .product-title { font-size: 15px; font-weight: bold; color: #2c3e50; margin-bottom: 8px; }
        .action-btn { background-color: #25D366; color: white; border: none; padding: 8px; width: 100%; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: bold; margin-top: 4px; }
        .cart-box, .order-box, .admin-section, .reviews-section { background: #fff; border-radius: 16px; padding: 15px; margin-top: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 2px solid #3498db; text-align: right; }
        .order-box input, .order-box textarea, .admin-section input, .admin-section select, .reviews-section textarea { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: Tahoma; }
        #floating-admin-btn { display: none; position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; background-color: #2980b9; color: white; border-radius: 50%; text-align: center; font-size: 30px; line-height: 58px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); cursor: pointer; z-index: 1000; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-nav-bar">
            <button class="top-btn" onclick="toggleCartModal()">🛒 <span id="cart-badge" style="background:#e74c3c;color:#fff;font-size:10px;padding:2px 6px;border-radius:50%;display:none;">0</span></button>
            <button class="top-btn" onclick="openSidebar()">☰</button>
        </div>
        <div id="sidebar">
            <button class="close-btn" onclick="closeSidebar()">✕</button>
            <h3 style="padding: 0 20px; color: #2c3e50;">⚙️ القائمة الرئيسية</h3>
            <a onclick="closeSidebar(); openSettingsModal()">1️⃣ ⚙️ الإعدادات</a>
            <a onclick="closeSidebar(); filterCategory('تطبيق')">2️⃣ 📱 التطبيقات</a>
            <a onclick="closeSidebar(); filterCategory('لعبة')">3️⃣ 🎮 الألعاب</a>
            <a onclick="closeSidebar(); switchTab('reviews')">4️⃣ 💬 التعليقات</a>
            <a onclick="closeSidebar(); filterCategory('الكل'); switchTab('home')" style="color: #27ae60;">🏠 الرئيسية</a>
            <a onclick="closeSidebar(); logoutAdmin()" id="sidebar-logout-link" style="color: #e74c3c; display: none;">🚪 تسجيل خروج</a>
        </div>
        <h2 id="header-store-name" style="color: #2c3e50;">موني مود ستور</h2>
        <div id="main-content-view">
            <div class="search-box"><input type="text" id="search-input" placeholder="🔍 ابحث هنا..." oninput="filterProducts()"></div>
            <div id="products-list" class="products-grid"></div>
        </div>
        <div id="floating-admin-btn" onclick="openAddMode()">+</div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script>
        // ضع كود الـ JavaScript الخاص بك هنا داخل وسم السكربت
        console.log("Store Loaded");
    </script>
</body>
</html>
