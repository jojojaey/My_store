<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موني مود | ستور - Money Mod</title>
    <!-- أيقونة الموقع التي تظهر في المتصفح وعند البحث -->
    <link rel="icon" id="site-favicon" href="https://i.imgur.com/7kf5U8N.png">
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f0f4f8; margin: 0; padding: 10px; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; padding: 10px; }
        h2 { color: #2c3e50; margin-bottom: 5px; }
        p.subtitle { color: #7f8c8d; font-size: 14px; margin-bottom: 20px; }
        
        .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        
        .product-card { background: #fff; border-radius: 16px; padding: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #eaeaea; }
        .product-card img { width: 90px; height: 90px; object-fit: cover; border-radius: 14px; margin: 0 auto 10px auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .product-title { font-size: 15px; font-weight: bold; color: #2c3e50; margin-bottom: 5px; min-height: 40px; display: flex; align-items: center; justify-content: center; }
        .product-price { color: #27ae60; font-weight: bold; font-size: 14px; margin-bottom: 10px; }
        
        .buy-btn { background-color: #25D366; color: white; border: none; padding: 8px; width: 100%; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: bold; }
        .buy-btn:hover { background-color: #1ebe5d; }
        
        .delete-btn { background-color: #e74c3c; color: white; border: none; padding: 5px; width: 100%; border-radius: 6px; font-size: 11px; cursor: pointer; margin-top: 5px; display: none; }

        .order-box { background: #fff; border-radius: 16px; padding: 15px; margin-top: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 2px solid #3498db; text-align: right; }
        input { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        
        /* لوحة تحكم المشرفين (تكون منسدلة أو مخفية) */
        .admin-section { display: none; background: #fff; padding: 15px; border-radius: 16px; margin-top: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 2px dashed #3498db; text-align: right; }
        .image-upload-btn { display: block; background: #f8f9fa; border: 2px dashed #3498db; color: #3498db; padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; font-weight: bold; margin: 8px 0; font-size: 13px; }
        
        /* زر الدائرة العائمة للزائد في الجانب السفلي للمشرفين فقط */
        #floating-admin-btn {
            display: none;
            position: fixed;
            bottom: 25px;
            left: 25px;
            width: 60px;
            height: 60px;
            background-color: #2980b9;
            color: white;
            border-radius: 50%;
            text-align: center;
            font-size: 30px;
            line-height: 58px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 1000;
            font-weight: bold;
        }
        #floating-admin-btn:hover { background-color: #1f618d; }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🛍️ موني مود - Money Mod</h2>
        <p class="subtitle">اختر الاشتراك المناسب واطلب مباشرة</p>

        <!-- شبكة المنتجات -->
        <div id="products-list" class="products-grid"></div>

        <!-- نموذج إتمام الطلب -->
        <div id="order-form-container" class="order-box hidden">
            <h3 id="selected-product-name" style="color: #2980b9; text-align: center; margin-top: 0;">إتمام الطلب</h3>
            <label style="font-size: 13px; font-weight: bold;">اسمك الكامل:</label>
            <input type="text" id="cust-name" placeholder="أدخل اسمك هنا">
            <label style="font-size: 13px; font-weight: bold;">رقم هاتفـك:</label>
            <input type="tel" id="cust-phone" placeholder="أدخل رقمك هنا">
            <button class="buy-btn" onclick="submitOrder()" style="margin-top: 10px; font-size: 14px;">إرسال الطلب الآن</button>
            <button onclick="cancelOrder()" style="background-color: #95a5a6; color: white; border: none; padding: 8px; width: 100%; border-radius: 8px; margin-top: 5px; cursor: pointer;">إلغاء</button>
        </div>

        <!-- لوحة تحكم المسؤولين (تفتح عند الضغط على زر الزائد العائم) -->
        <div id="admin-panel" class="admin-section">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h4 style="color: #2980b9; margin: 0;">⚙️ لوحة إدارة المتجر</h4>
                <button onclick="closeAdminPanel()" style="background: #e74c3c; width: auto; padding: 5px 10px; font-size: 12px;">إغلاق اللوحة</button>
            </div>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">
            
            <label style="font-size: 12px; font-weight: bold; color: #555;">رقم واتساب استلام الطلبات:</label>
            <input type="text" id="admin-phone" placeholder="مثلاً: 9647800000000" oninput="savePhone()" style="background: #f9f9f9;">
            <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">

            <input type="text" id="new-name" placeholder="اسم الاشتراك (مثلاً: Gemini Pro)">
            <input type="text" id="new-price" placeholder="السعر (مثلاً: 15,000 د.ع)">
            
            <label class="image-upload-btn">
                ➕ اضغط لاختيار صورة الاشتراك من المعرض
                <input type="file" id="new-img-file" accept="image/*" style="display: none;">
            </label>
            <div id="file-name-display" style="font-size: 11px; color: #7f8c8d; margin-bottom: 8px; text-align: center;">لم يتم اختيار صورة بعد</div>

            <button class="buy-btn" onclick="addProduct()" style="background-color: #2980b9;">➕ إضافة ونشر الاشتراك</button>
        </div>

        <!-- زر الدخول المخفي للإدارة في أسفل الصفحة -->
        <div style="margin-top: 50px; text-align: center;">
            <span onclick="loginAdmin()" style="color: #bdc3c7; font-size: 11px; cursor: pointer;">⚙️ تسجيل دخول المشرفين</span>
        </div>
    </div>

    <!-- زر الدائرة العائمة المزود بعلامة الزائد (يظهر فقط للمسؤولين) -->
    <div id="floating-admin-btn" onclick="toggleAdminPanel()">+</div>

    <script>
        let products = JSON.parse(localStorage.getItem('store_products')) || [];
        let savedPhone = localStorage.getItem('store_target_phone') || "9647800680046";
        document.getElementById('admin-phone').value = savedPhone;

        let selectedProduct = "";
        let base64Image = "";
        let isAdmin = false;

        function loginAdmin() {
            let pass = prompt("الرجاء إدخال كلمة مرور المشرف:");
            if (pass === "2026") {
                isAdmin = true;
                document.getElementById('floating-admin-btn').style.display = 'block';
                renderProducts();
                alert("مرحباً بكِ أستاذتي! تم تفعيل صلاحيات الإدارة، راقبي زر الدائرة العائمة (+) أسفل الشاشة.");
            } else {
                alert("كلمة المرور خاطئة!");
            }
        }

        function toggleAdminPanel() {
            let panel = document.getElementById('admin-panel');
            if (panel.style.display === 'block') {
                panel.style.display = 'none';
            } else {
                panel.style.display = 'block';
            }
        }

        function closeAdminPanel() {
            document.getElementById('admin-panel').style.display = 'none';
        }

        function savePhone() {
            let phoneVal = document.getElementById('admin-phone').value;
            localStorage.setItem('store_target_phone', phoneVal);
        }

        document.getElementById('new-img-file').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if (file) {
                document.getElementById('file-name-display').innerText = "تم اختيار الصورة: " + file.name;
                let reader = new FileReader();
                reader.onload = function(event) {
                    base64Image = event.target.result;
                    // تحديث أيقونة الموقع تلقائياً بأول صورة يرفعها المشرف كرمز للموقع
                    document.getElementById('site-favicon').href = base64Image;
                    localStorage.setItem('store_favicon', base64Image);
                };
                reader.readAsDataURL(file);
            }
        });

        // استرجاع أيقونة الموقع المحفوظة إن وجدت
        let savedFavicon = localStorage.getItem('store_favicon');
        if (savedFavicon) {
            document.getElementById('site-favicon').href = savedFavicon;
        }

        function renderProducts() {
            let list = document.getElementById('products-list');
            if (products.length === 0) {
                list.innerHTML = `<p style="grid-column: span 2; color: #888; font-size: 13px; text-align: center;">لا توجد اشتراكات مضافة حالياً. اضغطي على زر (+) العائم بالأسفل بعد تسجيل الدخول لإضافة أول منتج!</p>`;
                return;
            }
            list.innerHTML = "";
            products.forEach((p, index) => {
                let deleteBtnHtml = isAdmin ? `<button class="delete-btn" style="display:block;" onclick="deleteProduct(${index})">حذف المنتج</button>` : '';
                
                list.innerHTML += `
                    <div class="product-card">
                        <div>
                            <img src="${p.img}" alt="${p.name}">
                            <div class="product-title">${p.name}</div>
                            <div class="product-price">${p.price}</div>
                        </div>
                        <div>
                            <button class="buy-btn" onclick="openOrderForm('${p.name}')">طلب الاشتراك</button>
                            ${deleteBtnHtml}
                        </div>
                    </div>
                `;
            });
        }

        function addProduct() {
            let name = document.getElementById('new-name').value;
            let price = document.getElementById('new-price').value;

            if(!name || !price) {
                alert("يرجى ملء اسم الاشتراك والسعر على الأقل!");
                return;
            }

            let finalImg = base64Image || 'https://via.placeholder.com/90?text=No+Image';

            products.push({ name, price, img: finalImg });
            localStorage.setItem('store_products', JSON.stringify(products));
            
            document.getElementById('new-name').value = "";
            document.getElementById('new-price').value = "";
            document.getElementById('new-img-file').value = "";
            document.getElementById('file-name-display').innerText = "لم يتم اختيار صورة بعد";
            base64Image = "";
            
            renderProducts();
            document.getElementById('admin-panel').style.display = 'none';
            alert("تم إضافة الاشتراك بنجاح ونشره في متجر موني مود!");
        }

        function deleteProduct(index) {
            if(confirm("هل أنت متأكد من حذف هذا الاشتراك؟")) {
                products.splice(index, 1);
                localStorage.setItem('store_products', JSON.stringify(products));
                renderProducts();
            }
        }

        function openOrderForm(productName) {
            selectedProduct = productName;
            document.getElementById('selected-product-name').innerText = "طلب: " + productName;
            document.getElementById('order-form-container').classList.remove('hidden');
            window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
        }

        function cancelOrder() {
            document.getElementById('order-form-container').classList.add('hidden');
        }

        function submitOrder() {
            let name = document.getElementById('cust-name').value;
            let phone = document.getElementById('cust-phone').value;
            let currentPhone = document.getElementById('admin-phone').value || "9647800680046";

            if(!name || !phone) {
                alert("يرجى إدخال الاسم ورقم الهاتف!");
                return;
            }

            let message = `مرحباً، أريد طلب اشتراك من متجر موني مود:%0A- المنتج: ${selectedProduct}%0A- اسم الزبون: ${name}%0A- رقم الهاتف: ${phone}`;
            let whatsappURL = `https://wa.me/${currentPhone}?text=${message}`;
            window.open(whatsappURL, '_blank');
        }

        renderProducts();
    </script>

</body>
</html>
