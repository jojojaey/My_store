<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موني مود | ستور الاحترافي - Money Mod</title>
    <link rel="icon" id="site-favicon" href="https://i.imgur.com/7kf5U8N.png">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; 
            background: #f8fafc; 
            margin: 0; 
            padding: 0; 
            color: var(--text-main); 
            text-align: right;
        }

        /* شريط التنقل العلوي الفخم */
        .navbar {
            background: var(--bg-gradient);
            color: white;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand-box h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
        .brand-box span { font-size: 11px; color: #a5b4fc; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }
        
        #become-admin-link {
            font-size: 12px;
            color: #cbd5e1;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 600;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }
        #become-admin-link:hover { background: rgba(255,255,255,0.2); color: white; }

        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }

        /* قسم المنتجات بتصميم Grid احترافي */
        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; color: #1e293b; display: flex; align-items: center; gap: 8px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-bottom: 40px; }
        
        .product-card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            padding: 18px; 
            text-align: center; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 20px 30px -10px rgba(99,102,241,0.15); }
        
        .product-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 14px; margin-bottom: 15px; background: #f1f5f9; }
        .product-title { font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 12px; }
        
        .product-info-box { display: flex; background: #f8fafc; border-radius: 12px; padding: 10px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        .info-col { flex: 1; text-align: center; }
        .info-col:first-child { border-left: 1px solid var(--border-color); }
        .info-label { font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 3px; font-weight: 500; }
        .info-val { font-size: 13px; font-weight: 700; color: var(--success); }
        .info-val.duration { color: var(--primary); }

        .btn-primary { background-color: var(--primary); color: white; border: none; padding: 11px; width: 100%; border-radius: 12px; font-size: 14px; cursor: pointer; font-weight: 600; transition: background 0.2s; box-shadow: 0 4px 12px rgba(99,102,241,0.25); }
        .btn-primary:hover { background-color: var(--primary-dark); }
        
        .delete-btn { background-color: #fee2e2; color: #ef4444; border: none; padding: 8px; width: 100%; border-radius: 10px; font-size: 12px; cursor: pointer; margin-top: 8px; font-weight: 600; transition: background 0.2s; }
        .delete-btn:hover { background-color: #fecaca; }

        /* النافذة المنبثقة للطلب الاحترافية (Modal) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px; box-sizing: border-box;
        }
        .modal-card {
            background: white; width: 100%; max-width: 450px; border-radius: 24px;
            padding: 25px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            animation: modalUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); text-align: right;
            box-sizing: border-box; max-height: 90vh; overflow-y: auto;
        }
        @keyframes modalUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
        .modal-header h3 { margin: 0; font-size: 18px; color: var(--primary); font-weight: 700; }
        .close-modal { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); }

        .form-group { margin-bottom: 15px; }
        .form-group label { font-size: 13px; font-weight: 600; color: #334155; display: block; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 12px 15px; border: 1px solid var(--border-color); border-radius: 12px; box-sizing: border-box; font-size: 14px; background: #f8fafc; transition: all 0.2s; }
        .form-control:focus { outline: none; border-color: var(--primary); background: white; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }

        /* لوحة التحكم الاحترافية للمدير */
        .admin-section { display: none; background: white; padding: 25px; border-radius: 24px; margin-top: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: 2px dashed var(--primary); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
        
        #floating-admin-btn {
            display: none; position: fixed; bottom: 30px; left: 30px; width: 60px; height: 60px;
            background: var(--primary); color: white; border-radius: 50%; text-align: center;
            font-size: 28px; line-height: 60px; box-shadow: 0 10px 25px rgba(99,102,241,0.4);
            cursor: pointer; z-index: 999; font-weight: bold; transition: transform 0.2s;
        }
        #floating-admin-btn:hover { transform: scale(1.05); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- شريط التنقل العلوي -->
    <div class="navbar">
        <div class="brand-box">
            <h1>🛍️ موني مود ستور</h1>
            <span>E-Commerce Platform</span>
        </div>
        <div id="become-admin-link" onclick="registerAdminFlow()">تسجيل المدير ⚙️</div>
    </div>

    <div class="container">
        
        <div class="section-title">📦 المنتجات المتوفرة</div>
        <!-- شبكة المنتجات -->
        <div id="products-list" class="products-grid"></div>

        <!-- لوحة تحكم المسؤول الاحترافية -->
        <div id="admin-panel" class="admin-section">
            <div class="admin-header">
                <h3 style="margin:0; color:var(--primary); font-size:18px;">⚙️ إعدادات لوحة التحكم</h3>
                <button onclick="closeAdminPanel()" style="background:#ef4444; color:white; border:none; padding:6px 14px; border-radius:8px; cursor:pointer; font-weight:600; font-size:12px;">إغلاق</button>
            </div>
            
            <div class="form-group">
                <label>📞 رقم واتساب استلام الطلبات الأساسي:</label>
                <input type="text" id="admin-phone" class="form-control" placeholder="مثلاً: 9647800000000" oninput="savePhone()">
            </div>
            <hr style="border:0; border-top:1px solid var(--border-color); margin:20px 0;">

            <h4 style="margin:0 0 12px 0; font-size:15px; color:#1e293b;">إضافة منتج جديد للمتجر:</h4>
            <div class="form-group"><label>اسم المنتج:</label><input type="text" id="new-name" class="form-control" placeholder="مثلاً: اشتراك برو"></div>
            <div class="form-group"><label>سعر المنتج:</label><input type="text" id="new-price" class="form-control" placeholder="مثلاً: 15 ألف"></div>
            <div class="form-group"><label>مدة المنتج (اختياري):</label><input type="text" id="new-duration" class="form-control" placeholder="مثلاً: 18 شهر"></div>
            <div class="form-group"><label>رابط صورة المنتج (رابط مباشر):</label><input type="text" id="new-img-url" class="form-control" placeholder="https://..."></div>

            <button class="btn-primary" onclick="addProduct()" style="margin-top:10px;">➕ نشر المنتج رسمياً</button>
        </div>
    </div>

    <!-- نافذة إتمام الطلب الاحترافية (Modal) -->
    <div id="order-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-product-title">إتمام الطلب</h3>
                <button class="close-modal" onclick="closeOrderModal()">&times;</button>
            </div>
            
            <div class="form-group">
                <label>👤 الاسم الكامل:</label>
                <input type="text" id="cust-name" class="form-control" placeholder="أدخل اسمك الثلاثي">
            </div>
            
            <div class="form-group">
                <label>📱 رقم الهاتف:</label>
                <input type="tel" id="cust-phone" class="form-control" placeholder="رقم الهاتف للتواصل">
            </div>

            <div class="form-group">
                <label>🌍 الدولة:</label>
                <input type="text" id="cust-country" class="form-control" placeholder="مثلاً: العراق">
            </div>

            <div class="form-group">
                <label>🏙️ المحافظة / المدينة:</label>
                <input type="text" id="cust-city" class="form-control" placeholder="مثلاً: بغداد">
            </div>

            <button class="btn-primary" onclick="submitOrder()" style="background-color: #22c55e; margin-top: 10px;">تأكيد وإرسال الطلب عبر الواتساب 🟢</button>
        </div>
    </div>

    <!-- زر القائمة العائمة للمدير -->
    <div id="floating-admin-btn" onclick="toggleAdminPanel()">+</div>

    <script>
        const ADMIN_SECRET_CODE = "jojo2026"; 

        const defaultProducts = [
            {
                name: "جيماني برو",
                price: "15 ألف",
                duration: "18 شهر",
                img: "https://i.imgur.com/7kf5U8N.png"
            },
            {
                name: "موني مود ستور",
                price: "1",
                duration: "دائم",
                img: "https://i.imgur.com/7kf5U8N.png"
            }
        ];

        let products = JSON.parse(localStorage.getItem('store_products')) || defaultProducts;
        let savedPhone = localStorage.getItem('store_target_phone') || "9647800680046";
        document.getElementById('admin-phone').value = savedPhone;

        let selectedProduct = "";
        let isRegisteredAdmin = localStorage.getItem('store_is_admin') === 'true';

        if (isRegisteredAdmin) {
            activateAdminMode();
        }

        function registerAdminFlow() {
            if (isRegisteredAdmin) {
                toggleAdminPanel();
                return;
            }

            let phone = prompt("يرجى إدخال رقم هاتفكِ:");
            if (!phone) return;
            let country = prompt("من أي بلد أنتِ؟");
            if (!country) return;
            let city = prompt("ما هي محافظتكِ؟");
            if (!city) return;
            
            let secret = prompt("أدخل كلمة السر الخاصة بصلاحيات الإدارة:");
            if (secret !== ADMIN_SECRET_CODE) {
                alert("كلمة السر غير صحيحة!");
                return;
            }

            let confirmWord = prompt("اكتبي كلمة ( تم ) لتأكيد التسجيل النهائي للأبد:");
            if (confirmWord && confirmWord.trim() === "تم") {
                localStorage.setItem('store_is_admin', 'true');
                isRegisteredAdmin = true;
                activateAdminMode();
                alert("تم تفعيل صلاحيات الإدارة بنجاح تام!");
            }
        }

        function activateAdminMode() {
            document.getElementById('floating-admin-btn').style.display = 'block';
            document.getElementById('become-admin-link').innerText = "⚙️ لوحة التحكم مفعلة";
            renderProducts();
        }

        function toggleAdminPanel() {
            let panel = document.getElementById('admin-panel');
            panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
            if(panel.style.display === 'block') {
                window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
            }
        }

        function closeAdminPanel() {
            document.getElementById('admin-panel').style.display = 'none';
        }

        function savePhone() {
            let phoneVal = document.getElementById('admin-phone').value;
            localStorage.setItem('store_target_phone', phoneVal);
        }

        function renderProducts() {
            let list = document.getElementById('products-list');
            if (products.length === 0) {
                list.innerHTML = `<p style="grid-column: 1/-1; color: #888; text-align: center;">لا توجد منتجات مضافة حالياً.</p>`;
                return;
            }
            list.innerHTML = "";
            products.forEach((p, index) => {
                let deleteBtnHtml = isRegisteredAdmin ? `<button class="delete-btn" onclick="deleteProduct(${index})">حذف المنتج</button>` : '';
                
                let durationHtml = p.duration ? `
                    <div class="product-info-box">
                        <div class="info-col">
                            <span class="info-label">المدة</span>
                            <span class="info-val duration">${p.duration}</span>
                        </div>
                        <div class="info-col">
                            <span class="info-label">السعر</span>
                            <span class="info-val">${p.price}</span>
                        </div>
                    </div>
                ` : `
                    <div class="product-info-box" style="justify-content: center;">
                        <div class="info-col" style="border:none;">
                            <span class="info-label">السعر</span>
                            <span class="info-val" style="font-size: 15px;">${p.price}</span>
                        </div>
                    </div>
                `;

                list.innerHTML += `
                    <div class="product-card">
                        <div>
                            <img src="${p.img}" alt="${p.name}">
                            <div class="product-title">${p.name}</div>
                            ${durationHtml}
                        </div>
                        <div>
                            <button class="btn-primary" onclick="openOrderModal('${p.name}')">اطلب الآن 🛒</button>
                            ${deleteBtnHtml}
                        </div>
                    </div>
                `;
            });
        }

        function addProduct() {
            let name = document.getElementById('new-name').value;
            let price = document.getElementById('new-price').value;
            let duration = document.getElementById('new-duration').value;
            let imgUrl = document.getElementById('new-img-url').value;

            if(!name || !price) {
                alert("يرجى ملء اسم المنتج والسعر على الأقل!");
                return;
            }

            let finalImg = imgUrl.trim() !== "" ? imgUrl : 'https://i.imgur.com/7kf5U8N.png';

            products.push({ name, price, duration, img: finalImg });
            localStorage.setItem('store_products', JSON.stringify(products));
            
            document.getElementById('new-name').value = "";
            document.getElementById('new-price').value = "";
            document.getElementById('new-duration').value = "";
            document.getElementById('new-img-url').value = "";
            
            renderProducts();
            document.getElementById('admin-panel').style.display = 'none';
            alert("تم نشر المنتج بنجاح!");
        }

        function deleteProduct(index) {
            if(confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
                products.splice(index, 1);
                localStorage.setItem('store_products', JSON.stringify(products));
                renderProducts();
            }
        }

        function openOrderModal(productName) {
            selectedProduct = productName;
            document.getElementById('modal-product-title').innerText = "طلب منتج: " + productName;
            document.getElementById('order-modal').style.display = 'flex';
        }

        function closeOrderModal() {
            document.getElementById('order-modal').style.display = 'none';
        }

        function submitOrder() {
            let name = document.getElementById('cust-name').value.trim();
            let phone = document.getElementById('cust-phone').value.trim();
            let country = document.getElementById('cust-country').value.trim();
            let city = document.getElementById('cust-city').value.trim();
            let currentPhone = document.getElementById('admin-phone').value || "9647800680046";

            if(!name || !phone || !country || !city) {
                alert("يرجى تعبئة كافة الحقول المطلوبة (الاسم، الهاتف، الدولة، والمافظة) بدقة!");
                return;
            }

            let message = `🚀 *طلب جديد من المتجر الاحترافي*:%0A` +
                          `---------------------------------%0A` +
                          `📦 *المنتج:* ${selectedProduct}%0A` +
                          `👤 *اسم الزبون:* ${name}%0A` +
                          `📱 *رقم الهاتف:* ${phone}%0A` +
                          `🌍 *الدولة:* ${country}%0A` +
                          `🏙️ *المحافظة:* ${city}%0A` +
                          `---------------------------------`;
            
            let whatsappURL = `https://wa.me/${currentPhone}?text=${message}`;
            window.open(whatsappURL, '_blank');
            closeOrderModal();
        }

        renderProducts();
    </script>

</body>
</html>
